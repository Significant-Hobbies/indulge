name: Indulge web CI

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/check-site.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/check-site.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
