name: Indulge

options:
  bundleIdPrefix: com.significanthobbies
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Indulge:
    type: application
    platform: iOS
    sources:
      - path: Indulge
        excludes:
          - Resources/OnboardingStanding.png
    resources:
      - path: Indulge/Resources
    settings:
      base:
        DEVELOPMENT_TEAM: 8F7LXHTJZR
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.indulge
        PRODUCT_NAME: Indulge
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Indulge
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    scheme:
      testTargets:
        - IndulgeTests
      gatherCoverageData: true

  IndulgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IndulgeTests
    dependencies:
      - target: Indulge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.indulge.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Indulge.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Indulge"
        BUNDLE_LOADER: "$(TEST_HOST)"
